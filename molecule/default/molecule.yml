---
driver:
  name: docker
platforms:
  - name: ubuntu-jammy-wireguard
    image: ubuntu:22.04
    dockerfile: Dockerfile.j2
    privileged: true
    published_ports:
      - 0.0.0.0:5050:5000/tcp
    command: "/sbin/init"
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: testinfra
